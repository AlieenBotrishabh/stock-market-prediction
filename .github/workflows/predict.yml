name: Retrain models (manual)

# NOTHING ON THE SITE DEPENDS ON THIS WORKFLOW.
#
# Forecasts are produced by ONNX inference inside the API at request time,
# using bundles committed under ml-pipeline/export/. They are served on a
# fresh deploy with no job having run, so a failure here can never take
# predictions off the site.
#
# It used to run on a schedule and fail most days, and because predictions
# were read from its output back then, a failed run meant no forecasts at
# all. Removing the schedule removes that whole class of outage: retraining
# is now an explicit choice, made when you want new weights, and its output
# is reviewed before being committed.
#
# Run it from the Actions tab when you want to refresh the models.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [publish, train-only]
        default: publish
      symbols:
        description: 'Space-separated symbols (blank = all configured)'
        default: ''

concurrency:
  group: predictions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-pipeline/requirements.txt

      - name: Install dependencies
        working-directory: ml-pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Trained weights and scalers persist between runs so weekday
      # inference does not have to retrain. The Saturday job refreshes them.
      - name: Restore trained models
        uses: actions/cache@v4
        with:
          path: |
            ml-pipeline/models
            ml-pipeline/scalers
            ml-pipeline/reports
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Decide mode
        id: mode
        run: echo "mode=${{ github.event.inputs.mode || 'publish' }}" >> "$GITHUB_OUTPUT"

      - name: Train and validate
        working-directory: ml-pipeline
        env:
          MODEL_VERSION: lstm-150-single-v1
          LOG_LEVEL: INFO
          # Runners are CPU-only. A single-layer LSTM(150) over ~2,500 rows
          # trains in a couple of minutes on CPU, so no GPU is required.
          TF_CPP_MIN_LOG_LEVEL: '2'
          CUDA_VISIBLE_DEVICES: '-1'
        run: |
          SYMBOLS_ARG=""
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMBOLS_ARG="--symbols ${{ github.event.inputs.symbols }}"
          fi
          python main.py --train $SYMBOLS_ARG

      - name: Export ONNX bundles
        working-directory: ml-pipeline
        run: python export_onnx.py --all

      # Only runs when HF_TOKEN is configured; without it the workflow
      # still trains and uploads the bundles as build artifacts.
      - name: Publish to Hugging Face
        if: ${{ steps.mode.outputs.mode != 'train-only' && env.HF_TOKEN != '' }}
        working-directory: ml-pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO || 'Ace6868/stock-price-prediction-lstm' }}
        run: python push_to_hf.py --all

      - name: Summary
        if: always()
        working-directory: ml-pipeline
        run: python main.py --status >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Upload logs and bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            ml-pipeline/logs/
            ml-pipeline/reports/
            ml-pipeline/export/
          retention-days: 14
