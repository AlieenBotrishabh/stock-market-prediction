name: Daily predictions

# Runs after the NSE close. 10:30 UTC = 16:00 IST, half an hour after the
# 15:30 IST close, so the day's final bar is available from Yahoo.
on:
  schedule:
    - cron: '30 10 * * 1-5'   # weekdays, inference only
    - cron: '30 12 * * 6'     # Saturday, full retrain
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [predict, full]
        default: predict
      symbols:
        description: 'Space-separated symbols (blank = all configured)'
        default: ''

concurrency:
  group: predictions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-pipeline/requirements.txt

      - name: Install dependencies
        working-directory: ml-pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Trained weights and scalers persist between runs so weekday
      # inference does not have to retrain. The Saturday job refreshes them.
      - name: Restore trained models
        uses: actions/cache@v4
        with:
          path: |
            ml-pipeline/models
            ml-pipeline/scalers
            ml-pipeline/reports
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "30 12 * * 6" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode || 'predict' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        working-directory: ml-pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB || 'stockmarket' }}
          MODEL_VERSION: lstm-150-single-v1
          LOG_LEVEL: INFO
          # Runners are CPU-only. A single-layer LSTM(150) over ~2,500 rows
          # trains in a couple of minutes on CPU, so no GPU is required.
          TF_CPP_MIN_LOG_LEVEL: '2'
          CUDA_VISIBLE_DEVICES: '-1'
        run: |
          SYMBOLS_ARG=""
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            SYMBOLS_ARG="--symbols ${{ github.event.inputs.symbols }}"
          fi
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            python main.py --full $SYMBOLS_ARG
          else
            python main.py --predict --publish $SYMBOLS_ARG
          fi

      - name: Summary
        if: always()
        working-directory: ml-pipeline
        run: python main.py --status >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            ml-pipeline/logs/
            ml-pipeline/reports/
          retention-days: 14
