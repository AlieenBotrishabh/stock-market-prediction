# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Node/Express API (free plan).
# The Flask LSTM service runs on a free Hugging Face Space (see ml-pipeline/deploy_space.py).

services:
  - type: web
    name: stockpulse-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI      # MongoDB Atlas connection string, entered in the Render dashboard
        sync: false
      - key: INDIAN_API_KEY
        sync: false
      - key: INDIAN_API_BASE_URL
        value: https://stock.indianapi.in
      - key: ML_SERVICE_URL # Hugging Face Space running ml-pipeline/app.py
        value: https://ace6868-stockpulse-ml.hf.space
