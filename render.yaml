# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Node/Express API and the Flask LSTM prediction service.

services:
  # Flask + TensorFlow LSTM service (models are downloaded from the Hugging Face Hub)
  - type: web
    name: stockpulse-ml
    runtime: python
    rootDir: ml-pipeline
    plan: free          # ~440 MB RAM in use; switch to a larger plan if it runs out of memory
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_REPO_ID
        value: Ace6868/stock-price-prediction-lstm
      - key: HF_TOKEN       # only needed if the Hugging Face repo is private
        sync: false

  # Node/Express backend
  - type: web
    name: stockpulse-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI      # MongoDB Atlas connection string, entered in the Render dashboard
        sync: false
      - key: INDIAN_API_KEY
        sync: false
      - key: INDIAN_API_BASE_URL
        value: https://stock.indianapi.in
      - key: ML_SERVICE_URL # public URL of the stockpulse-ml service above
        value: https://stockpulse-ml.onrender.com
